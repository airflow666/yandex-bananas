<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Банановая башня</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2f1a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
  <!-- Yandex Games SDK: подключение строго по документации —
       https://yandex.ru/dev/games/doc/ru/sdk/sdk-about#connect
       Скрипт async, поэтому порядок его выполнения относительно
       ./src/main.js (type=module, всегда deferred) не гарантирован —
       ждём реального onload/onerror через промис, а не полагаемся
       на порядок тегов. Локально /sdk.js всегда 404 — игра корректно
       уходит в mock-режим (см. onerror ниже и src/yandex/sdk.js). -->
  <script>
    window.__yaSdkScriptLoaded = new Promise((resolve) => {
      window.__yaSdkOnLoad = () => resolve(true);
      window.__yaSdkOnError = () => resolve(false);
    });
  </script>
  <script async src="/sdk.js" onload="__yaSdkOnLoad()" onerror="__yaSdkOnError()"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
