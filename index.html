<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Банановая башня</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2f1a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
  <!-- SDK Яндекс Игр: абсолютный URL на домене Яндекса — не зависит от того,
       на каком хостинге/CDN лежит сама игра (относительный "/sdk.js" резолвится
       относительно origin игры и там 404-ится). Локально /games/sdk/v2 недоступен —
       игра переключится на mock-режим. -->
  <script src="https://yandex.ru/games/sdk/v2"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
