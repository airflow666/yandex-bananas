<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Банановая башня</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2f1a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
  <!-- SDK Яндекс Игр не подключён тегом в разметке намеренно: инлайновые
       <script>/onload-атрибуты — потенциальный риск при более строгом CSP
       на других хостингах, поэтому /sdk.js создаётся и подключается
       программно из src/yandex/sdk.js (document.createElement +
       .onload/.onerror как JS-свойства). Заодно это устраняет гонку
       состояний между async-загрузкой скрипта и нашим модулем. -->
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
