<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Банановая башня</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2f1a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
  <!-- SDK Яндекс Игр не подключён тегом в разметке намеренно: инлайновый
       <script> и инлайн-атрибуты onload/onerror могут быть тихо заблокированы
       Content-Security-Policy хостинга площадки (частая причина того, что
       игра "зависает", а debug-панель вечно показывает статус W — SDK физически
       грузится, а window.YaGames.init() у нас просто никогда не вызывается).
       Вместо этого /sdk.js создаётся и подключается программно из
       src/yandex/sdk.js (document.createElement + .onload/.onerror как
       JS-свойства, не HTML-атрибуты) — такой способ CSP инлайном не считает. -->
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
