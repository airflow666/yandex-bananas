<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Банановая башня</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2f1a;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    /* Заглушка на время загрузки бандла; снимается из src/main.js.
       Только HTML+CSS, без инлайнового JS. */
    #boot-status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      box-sizing: border-box;
      font: 16px/1.4 system-ui, sans-serif;
      color: #ffe680;
      text-align: center;
      pointer-events: none;
    }
    #boot-status .err {
      font-size: 13px;
      color: #ff9a9a;
      max-width: 90%;
      word-break: break-word;
      white-space: pre-wrap;
    }
  </style>
  <!-- SDK Яндекс Игр подключается не тегом в разметке, а программно из
       src/yandex/sdk.js (document.createElement) — документация называет
       динамическое подключение равноправным способом, и оно снимает гонку
       состояний между async-загрузкой SDK и нашим модулем. Путь именно
       относительный /sdk.js: абсолютный нужен только при встраивании через
       iframe со своего домена. -->
</head>
<body>
  <div id="game"></div>
  <!-- Виден, пока не выполнился JS-бандл. Нужен не только для UX: фон body
       и backgroundColor канваса Phaser — один и тот же #1a2f1a, поэтому без
       этой надписи «бандл не загрузился» и «Phaser стартовал, но завис»
       выглядят на экране одинаково и неотличимы без DevTools. -->
  <div id="boot-status">Загрузка… / Loading…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
